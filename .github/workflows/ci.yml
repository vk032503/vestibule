name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || echo "pyproject not yet set up"
      - name: Ruff
        run: |
          pip install ruff
          ruff check . || true
          ruff format --check . || true
      - name: mypy
        run: |
          pip install mypy
          mypy --strict src || true
      - name: Pytest
        run: |
          pip install pytest pytest-cov
          pytest --cov=src --cov-report=term || true

  changelog:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify CHANGELOG updated
        run: |
          BASE_REF="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED=$(git diff --name-only "$BASE_REF"...HEAD)
          if echo "$CHANGED" | grep -qE '^(src/|tests/)'; then
            if ! echo "$CHANGED" | grep -q '^CHANGELOG.md$'; then
              echo "::error::CHANGELOG.md must be updated when src/ or tests/ changes."
              exit 1
            fi
          fi