[project]
name = "vestibule"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "pymupdf>=1.24,<2.0",
    "azure-ai-documentintelligence>=1.0,<2.0",
    "azure-core>=1.30,<2.0",
    "tiktoken>=0.8,<1.0",
    "langchain-text-splitters>=0.3,<0.4",
    "openai>=1.50,<2.0",
    "tenacity>=9.0,<10.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "types-PyYAML>=6.0",
]
local = [
    "fastembed>=0.4,<1.0",
]
azure_search = [
    "azure-search-documents>=11.4,<12.0",
]
table_storage = [
    "azure-data-tables>=12.4,<13.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/vestibule"]

[[tool.mypy.overrides]]
# PyMuPDF (fitz) ships a `py.typed` marker but its SWIG-generated bindings are only
# partially annotated, so calls into it (pymupdf.open(), Document.tobytes(), etc.) are
# reported as "untyped function" calls under `mypy --strict`'s disallow_untyped_calls.
# Scoped to exactly the modules that call into PyMuPDF, so strict-mode checking is
# unchanged everywhere else in this codebase.
module = [
    "vestibule.analyzer.detect",
    "vestibule.analyzer.conftest",
    "vestibule.analyzer.parsers.pymupdf_parser",
    "vestibule.analyzer.parsers.test_pymupdf_parser",
    "vestibule.indexer.test_e2e_pipeline",
]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# fastembed is an optional dependency (the "local" extra, REQ-007) and is not installed
# by default, so it ships no resolvable type stubs in this environment. Scoped to
# exactly the one module that lazily imports it, so strict-mode checking is unchanged
# everywhere else in this codebase.
module = ["vestibule.embedder.adapters.fastembed"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# azure-search-documents is an optional dependency (the "azure_search" extra, REQ-008)
# and is not installed by default, so it ships no resolvable type stubs in this
# environment. Scoped to exactly the one module that lazily imports it (only inside
# `_load_real_backend`/`_build_search_index`, never at module import time), so
# strict-mode checking is unchanged everywhere else in this codebase.
module = [
    "vestibule.indexer.adapters.azure_ai_search",
    "vestibule.indexer.adapters._azure_search_backend",
    "vestibule.provisioning.adapters.azure_ai_search",
    "vestibule.provisioning.adapters._azure_search_backend",
]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
# azure-data-tables is an optional dependency (the "table_storage" extra, REQ-010) and
# is not installed by default, so it ships no resolvable type stubs in this
# environment. Scoped to exactly the one module that lazily imports it (only inside
# `_load_real_backend`/`_RealTableBackend`'s own methods, never at module import time),
# so strict-mode checking is unchanged everywhere else in this codebase.
module = [
    "vestibule.scenario.stores._azure_table_backend",
    "vestibule.provisioning.stores._azure_table_backend",
]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
