indexer:
  adapter: azure_ai_search     # azure_ai_search | in_memory — selects which IndexerAdapter
                                # the composition root constructs; not an IndexerConfig field
  index_name: vestibule-docs-v1   # composition-root concern, passed to the selected adapter's
                                   # own constructor; not an IndexerConfig field
  dimensions: 1024              # operational tunable — code-authoritative, see below. MUST
                                 # match the configured EmbedderConfig.target_dimensions (or
                                 # the adapter's native output dimensions if no MRL truncation
                                 # is applied) — see src/vestibule/indexer/indexer.py's module
                                 # docstring for why this is a flagged spec-gap resolution
  metric: cosine                # operational tunable — code-authoritative, see below
  hnsw:
    m: 4                        # operational tunable — code-authoritative, see below
    ef_construction: 400        # operational tunable — code-authoritative, see below
    ef_search: 500               # operational tunable — code-authoritative, see below
  batch_size: null              # operational tunable — code-authoritative, see below;
                                 # null means use the adapter's own max_batch_size
  delete_before_upsert_on_version_change: true   # operational tunable — code-authoritative
  retry:
    max_attempts: 5             # operational tunable — code-authoritative, see below
    backoff_base_seconds: 2     # operational tunable — code-authoritative, see below
    backoff_max_seconds: 60     # operational tunable — code-authoritative, see below

  azure_ai_search:
    endpoint_env_var: AZURE_SEARCH_ENDPOINT     # value read from env at process start, never here
    api_key_env_var: AZURE_SEARCH_API_KEY       # value read from env at process start, never here
    extra: azure_search          # pip install vestibule[azure_search]

  error_codes:
    INDEXER_EMPTY_RECORDS: PERMANENT
    INDEXER_DIMENSION_MISMATCH: PERMANENT
    INDEXER_MIXED_MODEL_BATCH: PERMANENT
    INDEXER_SCHEMA_CONFLICT: PERMANENT
    INDEXER_RECORD_TOO_LARGE: PERMANENT
    INDEXER_RATE_LIMITED: TRANSIENT
    INDEXER_UPSTREAM_ERROR: TRANSIENT
    INDEXER_TIMEOUT: TRANSIENT
    INDEXER_PARTIAL_BATCH_FAILURE: TRANSIENT
    INDEXER_INTERNAL: TRANSIENT
    INDEXER_DEPENDENCY_MISSING: PERMANENT

# NOTE: dimensions, metric, batch_size, delete_before_upsert_on_version_change, and
# retry.max_attempts/backoff_base_seconds/backoff_max_seconds are ordinary operational
# tunables (no bearing on Contract #2/#3 correctness) — the authoritative defaults live
# on IndexerConfig's/RetryConfig's dataclass fields (src/vestibule/indexer/indexer.py). This
# YAML block is kept in sync via a dedicated test
# (test_config_indexer_yaml_tunables_match_indexer_config_defaults), following the exact
# precedent config/embedder.yaml/config/chunker.yaml established (no config-loading
# mechanism exists anywhere in this codebase yet).
#
# `dimensions` is a deliberate addition beyond the story's literal indexer.yaml key
# list, flagged the same way config/embedder.yaml flags EMBEDDER_DEPENDENCY_MISSING: the
# story's own "Dimension consistency enforcement" section requires the orchestrator to
# call `adapter.ensure_schema(dimensions, metric)` at construction time, which is
# unimplementable without a `dimensions` value from somewhere. See
# src/vestibule/indexer/indexer.py's module docstring / this REQ's PR description.
#
# adapter/index_name/hnsw.*/azure_ai_search.* select and configure which IndexerAdapter
# the composition root constructs (out of scope here) — mirroring
# config/embedder.yaml's adapter/model/azure_openai.* block, these are never fields on
# IndexerConfig itself. endpoint_env_var/api_key_env_var name the environment variables
# the composition root must read to construct AzureAISearchIndexer — the actual
# endpoint URL and API key are never written to this file or any code (house rules:
# secrets from env only).
#
# error_codes follows the same documentation/audit-only convention as
# config/errors.yaml's known_codes: not read at runtime; the registry populated via
# register_error at import time (src/vestibule/indexer/model.py) is authoritative.
