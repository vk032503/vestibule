analyzer:
  scanned_pdf_probe_pages: 3            # operational tunable — code-authoritative, see below
  scanned_pdf_min_chars_per_page: 50    # operational tunable — code-authoritative, see below
  parser_timeout_seconds: 240           # operational tunable — code-authoritative, see below
  docint:
    endpoint_env_var: AZURE_DOCINT_ENDPOINT     # value read from env at process start, never here
    api_key_env_var: AZURE_DOCINT_API_KEY       # value read from env at process start, never here
    api_version: "2024-11-30"
    model_id: prebuilt-layout
  error_codes:
    ANALYZER_UNSUPPORTED_TYPE: PERMANENT
    ANALYZER_NO_PARSER: PERMANENT
    ANALYZER_DEPENDENCY_MISSING: PERMANENT
    PARSER_TIMEOUT: TRANSIENT
    DOCINT_RATE_LIMITED: TRANSIENT
    DOCINT_UPSTREAM_ERROR: TRANSIENT
    PARSER_INTERNAL: TRANSIENT

# NOTE: scanned_pdf_probe_pages, scanned_pdf_min_chars_per_page, and
# parser_timeout_seconds are ordinary operational tunables (no bearing on Contract
# #2/#3 correctness) — the authoritative defaults live on AnalyzerConfig's dataclass
# fields (src/vestibule/analyzer/analyzer.py). This YAML block is kept in sync via a
# dedicated test (test_config_analyzer_yaml_tunables_match_analyzer_config_defaults),
# following the exact precedent config/ledger.yaml's default_list_limit established (no
# config-loading mechanism exists anywhere in this codebase yet).
#
# docint.endpoint_env_var / api_key_env_var name the environment variables the
# composition root (out of scope here) must read to construct
# DocumentIntelligenceParser — the actual endpoint URL and API key are never written to
# this file or any code (house rules: secrets from env only).
#
# error_codes follows the same documentation/audit-only convention as
# config/errors.yaml's known_codes: not read at runtime; the registry populated via
# register_error at import time (src/vestibule/analyzer/model.py) is authoritative.
