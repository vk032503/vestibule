ledger:
  error_codes:
    LEDGER_TRANSITION_INVALID: PERMANENT
  default_list_limit: 100     # operational tunable — kept in sync with the code default, see below
  legal_transitions:          # documentation/audit only — safety invariant, code-authoritative, see below
    pending: [analyzing, failed, needs_review]
    analyzing: [chunking, failed]
    chunking: [embedding, failed]
    embedding: [indexing, failed]
    indexing: [indexed, failed]
    indexed: []
    failed: []
    needs_review: [pending, failed]   # REQ-009: parked-for-human-review; not terminal

# NOTE: these two keys are not the same kind of "config-only" carve-out:
#
# - legal_transitions matches config/envelope.yaml / config/identity.yaml's established
#   precedent exactly: it is listed for documentation/audit visibility only and is never
#   read at runtime to change behavior. The authoritative FSM lives in _LEGAL_TRANSITIONS
#   and validate_transition in src/vestibule/ledger/store.py. This is a genuine safety-invariant
#   exception to "all tunables from config": the transition table is Contract #3's
#   safety-critical invariant — a config edit alone must never be able to loosen which
#   stage transitions are legal, since that would silently permit corrupt/out-of-order
#   pipeline state. Changing the FSM requires a code change and a new LLD/PR.
#
#   needs_review (REQ-009): additive extension to this same table, not a new mechanism —
#   a document parked because its vertical/scenario could not be confidently determined.
#   Deliberately not terminal (no [] entry); see src/vestibule/vertical/loader.py and
#   docs/stories/REQ-009.md for the full rationale.
#
# - default_list_limit is a plain operational tunable with no idempotency or safety
#   implication — pagination page size has no bearing on Contract #2/#3 correctness — so
#   it does not share legal_transitions's justification. It is expressed in code as the
#   literal default (limit: int = 100) on LedgerStore.list_by_status /
#   InMemoryLedgerStore.__init__'s default_list_limit parameter. This value is the
#   documented source of truth for that literal, and the two are required to be kept in
#   sync by a dedicated test (test_config_default_list_limit_matches_code_default) rather
#   than by a runtime config-load, because no config-loading mechanism exists anywhere in
#   this codebase yet (see config/envelope.yaml, config/identity.yaml — equally
#   documentation-only today). Introducing the first one is out of scope for REQ-003.
