identity:
  hash_algo: sha256          # documentation/audit only — see below
  id_length: 64               # hex chars — documentation/audit only — see below
  error_codes:
    IDENTITY_INVALID: PERMANENT

# NOTE: hash_algo and id_length are listed here for documentation/audit visibility only;
# they are not read at runtime to change behavior. The authoritative algorithm is
# hardcoded (hashlib.sha256) and the authoritative length check is _HEX_RE in
# ingestion/identity/derive.py. This is deliberate: the derivation rule is a
# safety-critical, contract-defining invariant (Contract #2) — a config edit alone must
# never be able to change how doc_id/chunk_id are computed, since that would silently
# break idempotency for every document already indexed under the old scheme. Changing
# the algorithm requires a code change and a new LLD/PR.
