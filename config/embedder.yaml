embedder:
  adapter: azure_openai        # azure_openai | fastembed — selects which EmbedderAdapter
                                # the composition root constructs; not an EmbedderConfig field
  model: text-embedding-3-large  # passed to the selected adapter's own constructor
  target_dimensions: 1024      # operational tunable — code-authoritative, see below
  batch_size: null             # operational tunable — code-authoritative, see below;
                                # null means use the adapter's own max_batch_size
  retry:
    max_attempts: 5            # operational tunable — code-authoritative, see below
    backoff_base_seconds: 2    # operational tunable — code-authoritative, see below
    backoff_max_seconds: 60    # operational tunable — code-authoritative, see below

  azure_openai:
    endpoint_env_var: AZURE_OPENAI_ENDPOINT     # value read from env at process start, never here
    api_key_env_var: AZURE_OPENAI_API_KEY       # value read from env at process start, never here

  fastembed:
    extra: local                # pip install vestibule[local]

  error_codes:
    EMBEDDER_EMPTY_CHUNKS: PERMANENT
    EMBEDDER_MRL_UNSUPPORTED: PERMANENT
    EMBEDDER_INPUT_TOO_LONG: PERMANENT
    EMBEDDER_RATE_LIMITED: TRANSIENT
    EMBEDDER_UPSTREAM_ERROR: TRANSIENT
    EMBEDDER_TIMEOUT: TRANSIENT
    EMBEDDER_INTERNAL: TRANSIENT
    EMBEDDER_DEPENDENCY_MISSING: PERMANENT

# NOTE: target_dimensions, batch_size, and retry.max_attempts/backoff_base_seconds/
# backoff_max_seconds are ordinary operational tunables (no bearing on Contract #2/#3
# correctness) — the authoritative defaults live on EmbedderConfig's/RetryConfig's
# dataclass fields (ingestion/embedder/embedder.py). This YAML block is kept in sync via
# a dedicated test (test_config_embedder_yaml_tunables_match_embedder_config_defaults),
# following the exact precedent config/chunker.yaml/config/analyzer.yaml established (no
# config-loading mechanism exists anywhere in this codebase yet).
#
# adapter/model/azure_openai.*/fastembed.* select and configure which EmbedderAdapter the
# composition root constructs (out of scope here) — mirroring config/analyzer.yaml's
# docint.* block, these are never fields on EmbedderConfig itself. endpoint_env_var/
# api_key_env_var name the environment variables the composition root must read to
# construct AzureOpenAIEmbedder — the actual endpoint URL and API key are never written
# to this file or any code (house rules: secrets from env only).
#
# error_codes follows the same documentation/audit-only convention as
# config/errors.yaml's known_codes: not read at runtime; the registry populated via
# register_error at import time (ingestion/embedder/model.py) is authoritative.
# EMBEDDER_DEPENDENCY_MISSING is one addition beyond the story's literal seven-code
# list — see ingestion/embedder/model.py's module docstring for why.
