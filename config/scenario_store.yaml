scenario_store:
  backend: yaml                    # yaml | table_storage — selects which ScenarioStore
                                    # backend the composition root constructs; not a
                                    # ScenarioStore field

  yaml:
    directory: config/scenarios    # YamlScenarioStore reads one *.yaml file per
                                    # scenario from this directory

  table_storage:
    table_name: VestibuleScenarios
    connection_string_env_var: AZURE_TABLES_CONNECTION_STRING   # value read from env at
                                                                   # process start, never here
    extra: table_storage            # pip install vestibule[table_storage]

  cache:
    enabled: true                   # whether the composition root wraps the selected
                                     # backend in a CachedScenarioStore
    ttl_seconds: 60                 # operational tunable — code-authoritative, see below

  default_scenario_id: null         # fallback ScenarioStore.resolve() uses when a
                                     # document's vertical/scenario_id has no scenario

  error_codes:
    SCENARIO_NOT_FOUND: PERMANENT
    SCENARIO_INVALID: PERMANENT
    SCENARIO_STORE_READ_ONLY: PERMANENT
    SCENARIO_CONFLICT: TRANSIENT
    SCENARIO_STORE_UNAVAILABLE: TRANSIENT
    SCENARIO_STORE_DEPENDENCY_MISSING: PERMANENT

# NOTE: cache.ttl_seconds is an ordinary operational tunable (no bearing on Contract
# #2/#3 correctness) — the authoritative default lives on CachedScenarioStore's own
# constructor default (src/vestibule/scenario/stores/cached_store.py). This YAML block is
# kept in sync via a dedicated test
# (test_config_scenario_store_yaml_tunables_match_code_defaults), following the exact
# precedent config/indexer.yaml/config/embedder.yaml established (no config-loading
# mechanism for *tunables* exists anywhere in this codebase yet — YamlScenarioStore
# itself is the first REQ to actually load *data*, config/scenarios/*.yaml, from disk
# at runtime).
#
# backend/yaml.directory/table_storage.*/cache.enabled select and configure which
# ScenarioStore backend(s) the composition root constructs (out of scope here) —
# mirroring config/indexer.yaml's adapter/index_name/azure_ai_search.* block, these are
# never fields on any ScenarioStore backend's own constructor signature.
# connection_string_env_var names the environment variable the composition root must
# read to construct TableStorageScenarioStore — the actual connection string is never
# written to this file or any code (house rules: secrets from env only).
#
# default_scenario_id is consumed by ScenarioStore.resolve() (src/vestibule/scenario
# /stores/base.py), not by any single backend's own get/get_by_vertical/list_all/
# upsert/delete methods.
#
# error_codes follows the same documentation/audit-only convention as
# config/errors.yaml's known_codes: not read at runtime; the registry populated via
# register_error at import time (src/vestibule/scenario/model.py) is authoritative.
